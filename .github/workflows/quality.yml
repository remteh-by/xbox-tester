name: Android diagnostics quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: ./gradlew --no-daemon :diagnostics-core:test :app:assembleDebug :app:lintDebug
      - name: Missing release identity fails closed
        shell: bash
        env:
          REMTEH_KEYSTORE_FILE: ''
          REMTEH_KEYSTORE_PASSWORD: ''
          REMTEH_KEY_ALIAS: ''
          REMTEH_KEY_PASSWORD: ''
        run: |
          if ./gradlew --no-daemon :app:requireReleaseSigning > "$RUNNER_TEMP/signing-check.log" 2>&1; then
            echo 'Unexpected success without release identity'; exit 1
          fi
          grep -q 'Release signing is not configured' "$RUNNER_TEMP/signing-check.log"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-validation
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
